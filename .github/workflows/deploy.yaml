name: Homelab CI-CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Push
        run: |
          # 1. Build using your UV multi-stage Dockerfile
          # Pushing to localhost because the Runner is on the Ubuntu host
          docker build -t localhost:5111/my-python-app:latest .
          docker push localhost:5111/my-python-app:latest

      - name: Deploy to K3D
        run: |
          # 1. Ensure we are using the K3D config
          export KUBECONFIG=$HOME/.kube/config
          
          # 2. Add a retry/wait for the API server (Discovery fix)
          kubectl cluster-info || sleep 5
          
          # 3. Apply with validation disabled if the schema check fails
          # This bypasses the 'failed to download openapi' error
          kubectl apply -f k8s/deployment.yaml --validate=false
          
          # 4. Rollout
          kubectl rollout restart deployment/flask-homelab