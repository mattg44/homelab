name: Homelab CI-CD

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: [self-hosted, homelab]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build & Push
        run: |
          # 1. Build using your UV multi-stage Dockerfile
          # Pushing to localhost because the Runner is on the Ubuntu host
          docker build -t localhost:5111/my-python-app:latest .
          docker push localhost:5111/my-python-app:latest

      - name: Deploy to K3D
        run: |
          # 1. Export the LATEST kubeconfig to a temporary file
          k3d kubeconfig get homelab > cluster-config.yaml
          
          # 2. Tell ALL following kubectl commands to use THIS specific file
          export KUBECONFIG=$(pwd)/cluster-config.yaml
          
          # 3. Double-check the connection
          kubectl cluster-info
          
          # 4. Apply the manifest
          kubectl apply -f k8s/
          
          # 5. Restart the deployment to pick up the new 'latest' image
          kubectl rollout restart deployment/flask-homelab